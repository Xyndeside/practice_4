<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Конференции.РФ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top" id="top"></header>
  <main class="wrap">
    <div class="auth">
      <section class="pitch">
        <h1>Помещение для вашей всероссийской конференции</h1>
        <p>Выберите зал, дату и способ оплаты — заявку рассмотрит администратор портала.</p>
        <ul class="kinds">
          <li><b>Аудитории</b><span>лекции и форумы</span></li>
          <li><b>Коворкинги</b><span>рабочие сессии</span></li>
          <li><b>Кинозалы</b><span>презентации и показы</span></li>
        </ul>
      </section>
      <section class="card">
        <h2>Вход в портал</h2>
        <form id="form" novalidate>
          <div class="form-error" role="alert"></div>
          <label class="field"><span>Логин</span>
            <input name="login" autocomplete="username" autofocus>
            <small class="err" data-for="login"></small></label>
          <label class="field"><span>Пароль</span>
            <input name="password" type="password" autocomplete="current-password">
            <small class="err" data-for="password"></small></label>
          <button class="btn btn--block" type="submit">Войти</button>
        </form>
        <p class="switch"><a href="/register.html">Еще не зарегистрированы? Регистрация</a></p>
      </section>
    </div>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
