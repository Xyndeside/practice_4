<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Конференции.РФ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top" id="top"></header>
  <main class="wrap">
    <div class="auth">
      <section class="pitch">
        <h1>Создайте профиль организатора</h1>
        <p>Регистрация нужна один раз. После входа вы сможете подавать заявки и следить за их статусом.</p>
      </section>
      <section class="card">
        <h2>Регистрация</h2>
        <form id="form" novalidate>
          <div class="form-error" role="alert"></div>
          <label class="field"><span>Логин</span>
            <input name="login" autocomplete="username" placeholder="Латиница и цифры, от 6 символов">
            <small class="err" data-for="login"></small></label>
          <label class="field"><span>Пароль</span>
            <input name="password" type="password" autocomplete="new-password" placeholder="Не менее 8 символов">
            <small class="err" data-for="password"></small></label>
          <label class="field"><span>ФИО</span>
            <input name="fullName" autocomplete="name" placeholder="Иванов Иван Иванович">
            <small class="err" data-for="fullName"></small></label>
          <label class="field"><span>Телефон</span>
            <input name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="8(999)123-45-67">
            <small class="err" data-for="phone"></small></label>
          <label class="field"><span>Электронная почта</span>
            <input name="email" type="email" autocomplete="email" placeholder="name@example.ru">
            <small class="err" data-for="email"></small></label>
          <button class="btn btn--block" type="submit">Создать пользователя</button>
        </form>
        <p class="switch"><a href="/">Уже есть профиль? Войти</a></p>
      </section>
    </div>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
