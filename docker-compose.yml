# Порт, пароль и имя БД берутся из файла .env (docker compose читает его сам).
services:
  db:
    image: postgres:16
    container_name: conferences-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-conferences}
    ports:
      - "127.0.0.1:${DB_PORT:-5439}:5432"
    volumes:
      - conferences_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-conferences}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  conferences_pgdata:
